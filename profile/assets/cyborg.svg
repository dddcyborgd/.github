<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="dddcyborgd — the three-d cyborg daemon">
  <defs>
    <radialGradient id="g" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#9fe9ff" stop-opacity=".9"/><stop offset=".6" stop-color="#3b6cff" stop-opacity=".25"/><stop offset="1" stop-color="#05060c" stop-opacity="0"/></radialGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#9fe9ff"/><stop offset="1" stop-color="#f4d47c"/></linearGradient>
  </defs>
  <rect width="640" height="220" rx="18" fill="#05060c"/>
  <!-- the field of influence: an arcball, one short of the frame -->
  <circle cx="120" cy="110" r="88" fill="url(#g)"/>
  <g fill="none" stroke="#9fe9ff" stroke-opacity=".55" stroke-width="1.2">
    <circle cx="120" cy="110" r="72"/>
    <ellipse cx="120" cy="110" rx="72" ry="26"/>
    <ellipse cx="120" cy="110" rx="26" ry="72"/>
    <ellipse cx="120" cy="110" rx="72" ry="52" transform="rotate(-30 120 110)"/>
  </g>
  <!-- the aivatar: a figure reaching along the sphere, holding the sceptre -->
  <g stroke="#dfe7ff" stroke-width="4" stroke-linecap="round" fill="none">
    <circle cx="120" cy="82" r="9" fill="#dfe7ff" stroke="none"/>
    <path d="M120 92 v34 M120 104 l-16 18 M120 104 l24 -14 M120 126 l-11 22 M120 126 l11 22"/>
  </g>
  <g stroke="#f4d47c" stroke-width="3" stroke-linecap="round"><path d="M144 90 l30 -18"/></g>
  <circle cx="176" cy="71" r="6" fill="#f4d47c"/>
  <circle cx="176" cy="71" r="11" fill="none" stroke="#f4d47c" stroke-opacity=".5"/>
  <!-- the triad -->
  <g fill="none" stroke="#9fe9ff" stroke-opacity=".8" stroke-width="1.5">
    <path d="M300 60 L400 160 L500 60 Z"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#9aa6c4" text-anchor="middle">
    <text x="300" y="50">participant · host</text>
    <text x="500" y="50">participant · client</text>
    <text x="400" y="182">the DeltaVerse anchor</text>
  </g>
  <g fill="#9fe9ff"><circle cx="300" cy="60" r="5"/><circle cx="500" cy="60" r="5"/></g>
  <circle cx="400" cy="160" r="6" fill="#f4d47c"/>
  <text x="400" y="118" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="url(#t)" text-anchor="middle">dddcyborgd</text>
  <text x="400" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#dfe7ff" text-anchor="middle">the three-d cyborg daemon · every participant is both client and server</text>
</svg>
